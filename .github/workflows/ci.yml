# Runs the Godot (GUT) tests on Windows and Linux and the package builder tests (pytest) on Linux, then packs the
# release zips (tools/package_release.py) and installs them into an empty project (tools/check_package.py).
# On a v* tag it also builds the Ankara 40 km and the Üsküdar 10 km / 60 km terrain packages and attaches everything
# to a draft GitHub release.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  godot:
    name: Godot tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            godot_zip: Godot_v4.7.2-stable_win64.exe.zip
            godot_exe: Godot_v4.7.2-stable_win64_console.exe
          - name: Linux
            os: ubuntu-22.04
            godot_zip: Godot_v4.7.2-stable_linux.x86_64.zip
            godot_exe: Godot_v4.7.2-stable_linux.x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          Z="${{ matrix.godot_zip }}"; R="--retry 5 --retry-all-errors --retry-delay 10"; curl -sSfL $R -o godot.zip "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=${Z#Godot_v${GODOT_VERSION}-stable_}" || curl -sSfL $R -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$Z"
          python -m zipfile -e godot.zip godot_bin
          chmod +x "godot_bin/${{ matrix.godot_exe }}"
          echo "GODOT=$PWD/godot_bin/${{ matrix.godot_exe }}" >> "$GITHUB_ENV"
      - name: GUT
        run: |
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . -s addons/gut/gut_cmdln.gd

  python:
    name: Package builder tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # DEM tiles and the geoid grid are downloaded on the first run (public AWS buckets, PROJ CDN).
      - uses: actions/cache@v4
        with:
          path: |
            tools/.cache
            ~/.local/share/proj
          key: geo-data-${{ hashFiles('tests/python/**', 'tools/requirements.txt') }}
          restore-keys: geo-data-
      - name: Install
        run: |
          python -m venv tools/.venv
          tools/.venv/bin/python -m pip install --quiet -r tools/requirements.txt
          tools/.venv/bin/python -I tools/build_terrain.py --fetch-geoid
      - name: pytest
        run: tools/.venv/bin/python -m pytest tests/python -q -p no:cacheprovider

  package:
    name: Release zips
    needs: [godot, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"; fi
      - name: Pack addon and sample terrain
        run: python3 tools/package_release.py --version "$VERSION"
      - name: Download Godot
        run: |
          Z="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"; R="--retry 5 --retry-all-errors --retry-delay 10"; curl -sSfL $R -o godot.zip "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=${Z#Godot_v${GODOT_VERSION}-stable_}" || curl -sSfL $R -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$Z"
          python3 -m zipfile -e godot.zip godot_bin
          chmod +x "godot_bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
      - name: Install into an empty project
        run: |
          python3 tools/check_package.py "build/release/godot-geo-$VERSION.zip" build/release/godot-geo-terrain-samples.zip \
            --godot "godot_bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: godot-geo-${{ env.VERSION }}
          path: |
            build/release/*.zip
            build/release/SHA256SUMS.txt

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            tools/.cache
            ~/.local/share/proj
          key: geo-release-${{ hashFiles('tools/package_release.py', 'tools/requirements.txt') }}
          restore-keys: geo-data-
      - name: Install
        run: |
          python -m venv tools/.venv
          tools/.venv/bin/python -m pip install --quiet -r tools/requirements.txt
          tools/.venv/bin/python -I tools/build_terrain.py --fetch-geoid
      # The Sentinel-2 scene is pinned in tools/package_release.py, so the package matches the one checked locally.
      - name: Build release assets
        run: tools/.venv/bin/python -I tools/package_release.py --version "${GITHUB_REF_NAME#v}" --terrain
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: the CHANGELOG section of this version.
          awk -v h="## [${GITHUB_REF_NAME#v}]" 'index($0, h) == 1 {on = 1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --title "godot-geo $GITHUB_REF_NAME" --notes-file notes.md \
            build/release/*.zip build/release/SHA256SUMS.txt
